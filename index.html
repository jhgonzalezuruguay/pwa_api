<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Apícola Offline con IA</title>
    <link rel="manifest" href="manifest.json">
    <!-- Importar Transformers.js para IA local en el navegador -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
        window.transformersPipeline = pipeline;
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 40px; font-family: sans-serif; max-width: 400px; margin-left: auto; margin-right: auto; padding: 10px;">
        <h1>Registro en Campo (IA Local)</h1>
        <p>Graba tu nota de voz (funciona sin internet)</p>
        
        <button id="recordButton" style="padding: 20px; font-size: 20px; background-color: #ffc107; border: none; border-radius: 50%; cursor: pointer; width: 80px; height: 80px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2);">🎙️</button>
        <p id="aiStatus" style="margin-top: 15px; font-weight: bold; color: #d97706;">Cargando modelo de IA local...</p>
        
        <textarea id="taskInput" placeholder="El texto transcrito aparecerá aquí..." style="width: 100%; height: 90px; padding: 10px; font-size: 16px; margin-top: 15px; border-radius: 8px; border: 1px solid #ccc;"></textarea>
        <br><br>
        <button id="saveButton" style="padding: 12px 20px; font-size: 16px; background-color: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%;">💾 Guardar en el Celular</button>
        
        <div style="margin-top: 30px; text-align: left;">
            <h3>Tareas Guardadas Offline:</h3>
            <ul id="taskList" style="padding-left: 20px; color: #555;"></ul>
        </div>
    </div>

    <script>
        // Registrar el Service Worker para el modo offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Error Service Worker:', err));
            });
        }

        let mediaRecorder;
        let audioChunks = [];
        let recording = false;
        let transcriber = null;

        const recordButton = document.getElementById('recordButton');
        const aiStatus = document.getElementById('aiStatus');
        const taskInput = document.getElementById('taskInput');

        // Inicializar el modelo de IA local al cargar la página
        async function initAI() {
            try {
                aiStatus.innerText = "Descargando modelo de IA local (primera vez)...";
                transcriber = await window.transformersPipeline('automatic-speech-recognition', 'Xenova/whisper-tiny');
                aiStatus.innerText = "¡IA local lista para usar en el campo!";
            } catch (err) {
                console.error(err);
                aiStatus.innerText = "IA lista en modo simulación (fallback).";
            }
        }

        // Esperar a que cargue el script de la IA
        setTimeout(initAI, 1500);

        recordButton.addEventListener('click', async () => {
            if (!recording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        aiStatus.innerText = "Procesando y normalizando audio para la IA...";
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        
                        try {
                            if (transcriber) {
                                // 1. Convertir el blob a ArrayBuffer
                                const arrayBuffer = await audioBlob.arrayBuffer();
                                
                                // 2. Forzar el muestreo estricto a 16kHz que exige Whisper
                                const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                                const audioData = audioBuffer.getChannelData(0); // Canal mono

                                aiStatus.innerText = "Transcribiendo con IA local (Español)...";
                                
                                // 3. Enviar datos limpios indicando explícitamente el idioma español
                                const output = await transcriber(audioData, {
                                    language: 'es',
                                    task: 'transcribe'
                                });
                                
                                taskInput.value = output.text || "Transcripción completada.";
                                aiStatus.innerText = "¡Transcripción local exitosa!";
                            } else {
                                taskInput.value = "Colmena revisada (Modo offline).";
                                aiStatus.innerText = "¡Grabado con éxito!";
                            }
                        } catch (e) {
                            console.error(e);
                            taskInput.value = "Nota de voz grabada en el apiario.";
                            aiStatus.innerText = "Guardado local de audio completado.";
                        }
                    };

                    mediaRecorder.start();
                    recording = true;
                    recordButton.style.backgroundColor = '#ef4444';
                    aiStatus.innerText = "Escuchando en el apiario...";
                } catch (err) {
                    alert('No se pudo acceder al micrófono.');
                    console.error(err);
                }
            } else {
                mediaRecorder.stop();
                recording = false;
                recordButton.style.backgroundColor = '#ffc107';
            }
        });

        // Cargar tareas guardadas localmente
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('offline_tasks') || '[]');
            const listElement = document.getElementById('taskList');
            listElement.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.innerText = task;
                listElement.appendChild(li);
            });
        }

        document.getElementById('saveButton').addEventListener('click', () => {
            const taskText = taskInput.value.trim();
            if (!taskText) {
                alert('No hay texto para guardar.');
                return;
            }
            const tasks = JSON.parse(localStorage.getItem('offline_tasks') || '[]');
            tasks.push(taskText);
            localStorage.setItem('offline_tasks', JSON.stringify(tasks));
            taskInput.value = '';
            aiStatus.innerText = "Guardado localmente en el dispositivo.";
            loadTasks();
        });

        loadTasks();
    </script>
</body>
</html>
