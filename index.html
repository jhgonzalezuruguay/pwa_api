<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Apícola Offline</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div style="text-align: center; margin-top: 30px; font-family: sans-serif; max-width: 400px; margin-left: auto; margin-right: auto; padding: 15px;">
        <h2>Registro de Campo (Voz Offline)</h2>
        <p style="font-size: 14px; color: #666;">Graba notas en el apiario sin internet</p>
        
        <button id="recordButton" style="padding: 20px; font-size: 32px; background-color: #ffc107; border: none; border-radius: 50%; cursor: pointer; width: 90px; height: 90px; box-shadow: 0px 4px 8px rgba(0,0,0,0.2);">🎙️</button>
        <p id="status" style="margin-top: 15px; font-weight: bold; color: #d97706; font-size: 15px;">Toca el micrófono para grabar</p>
        
        <audio id="audioPreview" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
        
        <br>
        <button id="saveButton" style="padding: 12px 20px; font-size: 16px; background-color: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; display: none;">💾 Guardar Audio en Celular</button>
        
        <div style="margin-top: 30px; text-align: left;">
            <h3>Audios Guardados Offline:</h3>
            <ul id="audioList" style="padding-left: 20px; color: #444; font-size: 14px;"></ul>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }

        let db;
        const request = indexedDB.open("ApicolaAudioDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("audios")) {
                db.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            loadStoredAudios();
        };

        let mediaRecorder;
        let audioChunks = [];
        let recording = false;
        let currentBlob = null;

        const recordButton = document.getElementById('recordButton');
        const status = document.getElementById('status');
        const audioPreview = document.getElementById('audioPreview');
        const saveButton = document.getElementById('saveButton');

        recordButton.addEventListener('click', async () => {
            if (!recording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioPreview.src = URL.createObjectURL(currentBlob);
                        audioPreview.style.display = 'block';
                        saveButton.style.display = 'block';
                        status.innerText = "Grabación lista. ¡Guárdala!";
                    };

                    mediaRecorder.start();
                    recording = true;
                    recordButton.style.backgroundColor = '#ef4444';
                    status.innerText = "🔴 Grabando nota...";
                    audioPreview.style.display = 'none';
                    saveButton.style.display = 'none';
                } catch (err) {
                    alert('Permiso de micrófono requerido.');
                }
            } else {
                mediaRecorder.stop();
                recording = false;
                recordButton.style.backgroundColor = '#ffc107';
            }
        });

        saveButton.addEventListener('click', () => {
            if (!currentBlob) return;

            const transaction = db.transaction(["audios"], "readwrite");
            const store = transaction.objectStore("audios");
            store.add({ blob: currentBlob, fecha: new Date().toLocaleString("es-ES") });

            transaction.oncomplete = () => {
                status.innerText = "✅ Audio guardado en el celular.";
                audioPreview.style.display = 'none';
                saveButton.style.display = 'none';
                currentBlob = null;
                loadStoredAudios();
            };
        });

        function loadStoredAudios() {
            if (!db) return;
            const transaction = db.transaction(["audios"], "readonly");
            const store = transaction.objectStore("audios");
            const request = store.getAll();

            request.onsuccess = function() {
                const list = document.getElementById('audioList');
                list.innerHTML = '';
                const items = request.result;

                if (items.length === 0) {
                    list.innerHTML = '<li>No hay audios guardados.</li>';
                    return;
                }

                items.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.style.marginBottom = "20px";
                    li.innerHTML = `<strong>Nota ${index + 1} (${item.fecha}):</strong><br>`;
                    
                    const audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = URL.createObjectURL(item.blob);
                    audio.style.width = "100%";
                    audio.style.marginTop = "5px";

                    // Botón de compartir nativo del celular
                    const shareBtn = document.createElement('button');
                    shareBtn.innerText = "📤 Compartir Audio";
                    shareBtn.style.cssText = "margin-top: 8px; width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;";
                    
                    shareBtn.onclick = async () => {
                        const file = new File([item.blob], `audio_apiario_${index + 1}.webm`, { type: 'audio/webm' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file],
                                    title: 'Nota Apícola',
                                    text: 'Registro de voz desde el apiario'
                                });
                            } catch (error) {
                                console.log('Error al compartir', error);
                            }
                        } else {
                            alert('Tu navegador no soporta compartir archivos directamente. Usa el reproductor.');
                        }
                    };

                    li.appendChild(audio);
                    li.appendChild(shareBtn);
                    list.appendChild(li);
                });
            };
        }
    </script>
</body>
</html>
