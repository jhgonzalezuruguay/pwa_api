<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Apícola Offline con IA</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div style="text-align: center; margin-top: 40px; font-family: sans-serif; max-width: 400px; margin-left: auto; margin-right: auto; padding: 10px;">
        <h1>Registro en Campo (IA Local)</h1>
        <p>Graba tu nota de voz (funciona sin internet)</p>
        
        <button id="recordButton" style="padding: 20px; font-size: 20px; background-color: #ffc107; border: none; border-radius: 50%; cursor: pointer; width: 80px; height: 80px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2);">🎙️</button>
        <p id="aiStatus" style="margin-top: 15px; font-weight: bold; color: #d97706;">Presiona para grabar</p>
        
        <textarea id="taskInput" placeholder="El texto transcrito aparecerá aquí..." style="width: 100%; height: 90px; padding: 10px; font-size: 16px; margin-top: 15px; border-radius: 8px; border: 1px solid #ccc;"></textarea>
        <br><br>
        <button id="saveButton" style="padding: 12px 20px; font-size: 16px; background-color: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%;">💾 Guardar en el Celular</button>
        
        <div style="margin-top: 30px; text-align: left;">
            <h3>Tareas Guardadas Offline:</h3>
            <ul id="taskList" style="padding-left: 20px; color: #555;"></ul>
        </div>
    </div>

    <script>
        // Registrar el Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope));
            });
        }

        let mediaRecorder;
        let audioChunks = [];
        let recording = false;

        const recordButton = document.getElementById('recordButton');
        const aiStatus = document.getElementById('aiStatus');
        const taskInput = document.getElementById('taskInput');

        recordButton.addEventListener('click', async () => {
            if (!recording) {
                try {
                    // Solicitar permiso y acceder al micrófono del celular
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        aiStatus.innerText = "Procesando audio localmente en el dispositivo...";
                        
                        // Aquí conectaremos Whisper.wasm próximamente. 
                        // Por ahora simulamos la conversión del audio grabado a texto:
                        setTimeout(() => {
                            taskInput.value = "Audio capturado del apiario (Listo para procesar con IA local).";
                            aiStatus.innerText = "¡Audio grabado con éxito!";
                        }, 1500);
                    };

                    mediaRecorder.start();
                    recording = true;
                    recordButton.style.backgroundColor = '#ef4444'; // Rojo indica grabación activa
                    aiStatus.innerText = "Grabando voz en el apiario...";
                } catch (err) {
                    alert('No se pudo acceder al micrófono. Asegúrate de dar permisos.');
                    console.error(err);
                }
            } else {
                // Detener la grabación
                mediaRecorder.stop();
                recording = false;
                recordButton.style.backgroundColor = '#ffc107';
            }
        });

        // Cargar tareas guardadas
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('offline_tasks') || '[]');
            const listElement = document.getElementById('taskList');
            listElement.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.innerText = task;
                listElement.appendChild(li);
            });
        }

        document.getElementById('saveButton').addEventListener('click', () => {
            const taskText = taskInput.value.trim();
            if (!taskText) {
                alert('No hay texto para guardar.');
                return;
            }
            const tasks = JSON.parse(localStorage.getItem('offline_tasks') || '[]');
            tasks.push(taskText);
            localStorage.setItem('offline_tasks', JSON.stringify(tasks));
            taskInput.value = '';
            aiStatus.innerText = "Guardado localmente en el dispositivo.";
            loadTasks();
        });

        loadTasks();
    </script>
</body>
</html>
