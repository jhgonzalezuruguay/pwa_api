<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Apícola Offline</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif; max-width: 400px; margin-left: auto; margin-right: auto;">
        <h1>Registro de Campo</h1>
        <p>Graba o anota tu tarea apícola (offline)</p>
        
        <textarea id="taskInput" placeholder="Escribe o dicta tu tarea aquí..." style="width: 100%; height: 100px; padding: 10px; font-size: 16px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc;"></textarea>
        <br>
        <button id="saveButton" style="padding: 15px 25px; font-size: 18px; background-color: #ffc107; border: none; border-radius: 8px; cursor: pointer; width: 100%;">💾 Guardar Localmente</button>
        
        <p id="status" style="margin-top: 20px; font-weight: bold; color: #333;"></p>
        
        <div style="margin-top: 30px; text-align: left;">
            <h3>Registros Guardados en el Celular:</h3>
            <ul id="taskList" style="padding-left: 20px; color: #555;"></ul>
        </div>
    </div>

    <script>
        // Registrar el Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Error Service Worker:', err));
            });
        }

        // Función para cargar tareas guardadas al abrir la app
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('offline_tasks') || '[]');
            const listElement = document.getElementById('taskList');
            listElement.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.innerText = task;
                listElement.appendChild(li);
            });
        }

        // Guardar tarea en el almacenamiento local del celular
        document.getElementById('saveButton').addEventListener('click', () => {
            const taskText = document.getElementById('taskInput').value.trim();
            if (!taskText) {
                alert('Por favor escribe una tarea.');
                return;
            }

            const tasks = JSON.parse(localStorage.getItem('offline_tasks') || '[]');
            tasks.push(taskText);
            localStorage.setItem('offline_tasks', JSON.stringify(tasks));

            document.getElementById('taskInput').value = '';
            document.getElementById('status').innerText = "¡Guardado en el celular con éxito!";
            loadTasks();
        });

        // Cargar al iniciar
        loadTasks();
    </script>
</body>
</html>
